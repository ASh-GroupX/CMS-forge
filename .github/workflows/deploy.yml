name: Production Deployment

on:
  push:
    branches:
      - production

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @cms-auto/database generate

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Check OpenAPI contract consistency
        run: pnpm openapi:check

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run unit and sanity tests
        run: pnpm test

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check VPS SSH Reachability
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          timeout 15 bash -c "until nc -zvw5 \"$VPS_HOST\" \"$VPS_PORT\"; do sleep 1; done"

      - name: Create release tarball
        run: |
          tar -czf ../release.tar.gz --exclude=node_modules --exclude=.git --exclude=.github .
          mv ../release.tar.gz .

      - name: Upload release tarball to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: "release.tar.gz"
          target: "/root/cms-auto/"

      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -eu

            # Ensure target directory exists
            mkdir -p /root/cms-auto
            cd /root/cms-auto

            # Extract release package and clean up tarball
            tar -xzf release.tar.gz
            rm -f release.tar.gz

            # Set up pnpm and run local validation checks
            corepack enable
            corepack pnpm install --frozen-lockfile
            corepack pnpm prod:config:check -- --env-file .env.production
            docker compose --env-file .env.production -f docker-compose.prod.yml config

            # Create and verify a pre-migration database backup. Fail closed so
            # the migrate service cannot run unless the current database is safe.
            BACKUP_DIR=/root/cms-auto-backups/postgres
            BACKUP_FILE="$BACKUP_DIR/cms-auto-$(date -u +%Y%m%dT%H%M%SZ).dump"
            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
              sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$BACKUP_FILE"
            test -s "$BACKUP_FILE"
            chmod 600 "$BACKUP_FILE"
            echo "Pre-migration database backup created and verified"

            # Build and deploy production containers
            docker compose --env-file .env.production -f docker-compose.prod.yml build
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d

            # Clean up old unused images
            docker image prune -f

            # Health Check Verification (checks Docker container health status)
            echo "Waiting for services to become healthy..."
            API_HEALTHY=0
            WEB_HEALTHY=0
            for i in $(seq 1 30); do
              if [ "$API_HEALTHY" -eq 0 ] && docker inspect --format='{{.State.Health.Status}}' cms-auto-prod-api-1 2>/dev/null | grep -q "healthy"; then
                echo "API is healthy!"
                API_HEALTHY=1
              fi
              if [ "$WEB_HEALTHY" -eq 0 ] && docker inspect --format='{{.State.Health.Status}}' cms-auto-prod-web-1 2>/dev/null | grep -q "healthy"; then
                echo "Web UI is healthy!"
                WEB_HEALTHY=1
              fi
              if [ "$API_HEALTHY" -eq 1 ] && [ "$WEB_HEALTHY" -eq 1 ]; then
                break
              fi
              sleep 2
            done

            if [ "$API_HEALTHY" -ne 1 ] || [ "$WEB_HEALTHY" -ne 1 ]; then
              echo "Deployment failed: API or Web did not become healthy in time."
              docker compose --env-file .env.production -f docker-compose.prod.yml logs api || true
              docker compose --env-file .env.production -f docker-compose.prod.yml logs web || true
              exit 1
            fi

            echo "Production deployed and verified"
