name: Production Deployment

on:
  push:
    branches:
      - production

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PRODUCTION_SITE_DOMAIN: cms.laith-alobaidi-crm.com

jobs:
  validate:
    name: Validate and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @cms-auto/database generate

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Check OpenAPI contract consistency
        run: pnpm openapi:check

      - name: Install Playwright Browsers
        run: pnpm exec playwright-core install chromium

      - name: Run unit and sanity tests
        run: pnpm test

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check VPS SSH Reachability
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          timeout 60 bash -c "until nc -zvw5 \"$VPS_HOST\" \"$VPS_PORT\"; do sleep 5; done"

      - name: Create release tarball
        run: |
          tar -czf ../release.tar.gz --exclude=node_modules --exclude=.git --exclude=.github .
          mv ../release.tar.gz .

      - name: Upload release tarball to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: "release.tar.gz"
          target: "/root/cms-auto/"

      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -eu

            # Ensure target directory exists
            mkdir -p /root/cms-auto/uploads/attachments
            cd /root/cms-auto
            DEPLOYMENT_SHA='${{ github.sha }}'
            export DEPLOYMENT_SHA

            # Clean stale source trees to eliminate deleted/renamed routes while preserving .env.production
            rm -rf apps packages tools
            # Extract release package and clean up tarball
            tar -xzf release.tar.gz
            rm -f release.tar.gz

            # Validate production inputs without a runtime package download.
            node tools/prod-config-check.mjs --env-file .env.production
            docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet
            SITE_DOMAIN="$(grep '^SITE_DOMAIN=' .env.production | cut -d= -f2-)"
            test -n "$SITE_DOMAIN"
            test "$SITE_DOMAIN" = '${{ env.PRODUCTION_SITE_DOMAIN }}'

            # Create and verify a pre-migration database backup. Fail closed so
            # the migrate service cannot run unless the current database is safe.
            BACKUP_DIR=/root/cms-auto-backups/postgres
            BACKUP_FILE="$BACKUP_DIR/cms-auto-$(date -u +%Y%m%dT%H%M%SZ).dump"
            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres redis
            echo "Waiting for postgres and redis to accept connections..."
            for i in $(seq 1 30); do
              PG_OK=0
              REDIS_OK=0
              if docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
                sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1; then
                PG_OK=1
              fi
              if docker compose --env-file .env.production -f docker-compose.prod.yml exec -T redis \
                sh -c 'redis-cli ping | grep -q PONG' >/dev/null 2>&1; then
                REDIS_OK=1
              fi
              if [ "$PG_OK" = "1" ] && [ "$REDIS_OK" = "1" ]; then
                echo "Postgres and Redis are ready for operations"
                break
              fi
              sleep 1
            done
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
              sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$BACKUP_FILE"
            test -s "$BACKUP_FILE"
            chmod 600 "$BACKUP_FILE"
            echo "Pre-migration database backup created and verified"

            # Build and deploy production containers
            if ! ip link show docker0 >/dev/null 2>&1; then
              echo "docker0 bridge missing on host, restarting docker daemon..."
              systemctl restart docker || true
              sleep 3
            fi

            if ! docker compose --env-file .env.production -f docker-compose.prod.yml build; then
              echo "Docker build encountered network error, restarting docker daemon to heal network bridge..."
              systemctl restart docker || true
              sleep 3
              docker compose --env-file .env.production -f docker-compose.prod.yml build
            fi
            if ! docker compose --env-file .env.production -f docker-compose.prod.yml up -d; then
              echo "docker compose up -d failed, printing container logs..."
              docker compose --env-file .env.production -f docker-compose.prod.yml logs || true
              exit 1
            fi

            # Health Check Verification (checks every long-running CMS service)
            echo "Waiting for services to become healthy..."
            UNHEALTHY="api web worker caddy postgres redis"
            for i in $(seq 1 60); do
              UNHEALTHY=""
              for SERVICE in api web worker caddy postgres redis; do
                CONTAINER="cms-auto-prod-$SERVICE-1"
                STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER" 2>/dev/null || echo "missing")"
                if [ "$STATUS" != "healthy" ]; then
                  UNHEALTHY="$UNHEALTHY $SERVICE($STATUS)"
                fi
              done
              if [ -z "$UNHEALTHY" ]; then
                echo "All services healthy after attempt $i!"
                break
              fi
              if [ $((i % 5)) -eq 1 ]; then
                echo "Health check attempt $i/60: still waiting for:$UNHEALTHY"
              fi
              sleep 2
            done

            if [ -n "$UNHEALTHY" ]; then
              echo "Deployment failed: unhealthy services:$UNHEALTHY"
              docker compose --env-file .env.production -f docker-compose.prod.yml logs \
                api web worker caddy postgres redis || true
              exit 1
            fi

            # Fail closed unless all production routing defaults are queryable.
            echo "Verifying default departments..."
            DEFAULT_DEPARTMENT_COUNT="$(
              printf '%s\n' \
                "SELECT COUNT(*) FROM departments WHERE branch_id IS NULL AND is_active = true AND code IN ('SALES','SERVICE','PARTS','BODY_PAINT','FINANCE','CUSTOMER_CARE');" |
                docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
                  sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA' | tr -d '\r'
            )"
            if [ "$DEFAULT_DEPARTMENT_COUNT" != "6" ]; then
              echo "Department count is '$DEFAULT_DEPARTMENT_COUNT', installing missing default departments..."
              printf '%s\n' \
                "UPDATE \"departments\" AS dept SET \"code\" = d.code, \"name_en\" = d.name_en, \"name_ar\" = d.name_ar, \"branch_id\" = NULL, \"is_active\" = true, \"updated_at\" = CURRENT_TIMESTAMP FROM (VALUES ('SALES', 'Sales', 'المبيعات'), ('SERVICE', 'Service', 'الصيانة'), ('PARTS', 'Parts', 'قطع الغيار'), ('BODY_PAINT', 'Body & Paint', 'السمكرة والدهان'), ('FINANCE', 'Finance', 'المالية'), ('CUSTOMER_CARE', 'Customer Care', 'خدمة العملاء')) AS d(code, name_en, name_ar) WHERE dept.\"id\" = 'department_default_' || lower(d.code) AND NOT EXISTS (SELECT 1 FROM \"departments\" WHERE \"departments\".\"code\" = d.code);" \
                "UPDATE \"departments\" SET \"branch_id\" = NULL, \"is_active\" = true, \"updated_at\" = CURRENT_TIMESTAMP WHERE \"code\" IN ('SALES','SERVICE','PARTS','BODY_PAINT','FINANCE','CUSTOMER_CARE');" \
                "INSERT INTO \"departments\" (\"id\", \"code\", \"name_en\", \"name_ar\", \"branch_id\", \"is_active\", \"updated_at\") SELECT CASE WHEN NOT EXISTS (SELECT 1 FROM \"departments\" WHERE \"id\" = 'department_default_' || lower(d.code)) THEN 'department_default_' || lower(d.code) ELSE 'dept_default_' || lower(d.code) || '_' || substring(md5(random()::text) from 1 for 6) END, d.code, d.name_en, d.name_ar, NULL, true, CURRENT_TIMESTAMP FROM (VALUES ('SALES', 'Sales', 'المبيعات'), ('SERVICE', 'Service', 'الصيانة'), ('PARTS', 'Parts', 'قطع الغيار'), ('BODY_PAINT', 'Body & Paint', 'السمكرة والدهان'), ('FINANCE', 'Finance', 'المالية'), ('CUSTOMER_CARE', 'Customer Care', 'خدمة العملاء')) AS d(code, name_en, name_ar) WHERE NOT EXISTS (SELECT 1 FROM \"departments\" WHERE \"departments\".\"code\" = d.code);" |
                docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
                  sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
              DEFAULT_DEPARTMENT_COUNT="$(
                printf '%s\n' \
                  "SELECT COUNT(*) FROM departments WHERE branch_id IS NULL AND is_active = true AND code IN ('SALES','SERVICE','PARTS','BODY_PAINT','FINANCE','CUSTOMER_CARE');" |
                  docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
                    sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA' | tr -d '\r'
              )"
            fi
            echo "Default departments found: '$DEFAULT_DEPARTMENT_COUNT' (expected 6)"
            test "$DEFAULT_DEPARTMENT_COUNT" = "6"
            echo "Default departments verified"

            # Ensure at least one active branch exists
            echo "Verifying default branches..."
            BRANCH_COUNT="$(
              printf '%s\n' \
                "SELECT COUNT(*) FROM branches WHERE is_active = true;" |
                docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
                  sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA' | tr -d '\r'
            )"
            if [ "$BRANCH_COUNT" = "0" ]; then
              echo "No active branches found, installing default branches..."
              printf '%s\n' \
                "INSERT INTO \"branches\" (\"id\", \"code\", \"name_en\", \"name_ar\", \"timezone\", \"is_active\", \"created_at\", \"updated_at\") VALUES ('branch_default_main', 'MAIN', 'Main Branch', 'الفرع الرئيسي', 'Asia/Riyadh', true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('branch_default_north', 'NORTH', 'North Branch', 'فرع الشمال', 'Asia/Riyadh', true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (\"code\") DO NOTHING;" |
                docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
                  sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            fi
            echo "Default branches verified"

            echo "Verifying complaint root causes and sales advisors..."
            printf '%s\n' \
              "CREATE TABLE IF NOT EXISTS \"complaint_root_causes\" (\"id\" TEXT NOT NULL PRIMARY KEY, \"name_en\" TEXT NOT NULL, \"name_ar\" TEXT NOT NULL, \"order\" INTEGER NOT NULL DEFAULT 0, \"is_active\" BOOLEAN NOT NULL DEFAULT true, \"created_at\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP, \"updated_at\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP);" \
              "CREATE TABLE IF NOT EXISTS \"complaint_sales_advisors\" (\"id\" TEXT NOT NULL PRIMARY KEY, \"name_en\" TEXT NOT NULL, \"name_ar\" TEXT NOT NULL, \"order\" INTEGER NOT NULL DEFAULT 0, \"is_active\" BOOLEAN NOT NULL DEFAULT true, \"created_at\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP, \"updated_at\" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP);" \
              "INSERT INTO \"complaint_root_causes\" (\"id\", \"name_en\", \"name_ar\", \"order\", \"is_active\", \"created_at\", \"updated_at\") VALUES ('root_cause_1', 'Delay in Service/Delivery', 'تأخير في الخدمة أو التسليم', 1, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('root_cause_2', 'Parts Unavailability', 'عدم توفر قطع الغيار', 2, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('root_cause_3', 'Staff Conduct / Rude Behavior', 'سوء تعامل أو سلوك الموظف', 3, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('root_cause_4', 'Pricing / Billing Dispute', 'خلاف حول الفاتورة أو التسعير', 4, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('root_cause_5', 'Quality of Repair / Recurrent Issue', 'جودة الإصلاح أو تكرار المشكلة', 5, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('root_cause_6', 'Poor Communication', 'ضعف التواصل والمتابعة', 6, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('root_cause_7', 'Diagnostic Issue', 'خطأ في الفحص والتشخيص', 7, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (\"id\") DO NOTHING;" \
              "INSERT INTO \"complaint_sales_advisors\" (\"id\", \"name_en\", \"name_ar\", \"order\", \"is_active\", \"created_at\", \"updated_at\") VALUES ('sales_advisor_1', 'Ahmed Al-Mansoor', 'أحمد المنصور', 1, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sales_advisor_2', 'Faisal Al-Harbi', 'فيصل الحربي', 2, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sales_advisor_3', 'Tariq Al-Otaibi', 'طارق العتيبي', 3, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sales_advisor_4', 'Mohammed Al-Zahrani', 'محمد الزهراني', 4, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sales_advisor_5', 'Khalid Al-Shammari', 'خالد الشمري', 5, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (\"id\") DO NOTHING;" \
              "ALTER TABLE \"complaints\" ADD COLUMN IF NOT EXISTS \"alternative_car_provided\" BOOLEAN NOT NULL DEFAULT false;" \
              "ALTER TABLE \"complaints\" ADD COLUMN IF NOT EXISTS \"backup_officer_id\" TEXT;" \
              "ALTER TABLE \"complaints\" ADD COLUMN IF NOT EXISTS \"collaborator_id\" TEXT;" \
              "ALTER TABLE \"complaints\" ADD COLUMN IF NOT EXISTS \"is_justified\" BOOLEAN;" \
              "ALTER TABLE \"complaints\" ADD COLUMN IF NOT EXISTS \"satisfaction_status\" TEXT;" \
              "ALTER TABLE \"complaints\" ADD COLUMN IF NOT EXISTS \"investigation_notes\" TEXT;" \
              "ALTER TABLE \"complaints\" ADD COLUMN IF NOT EXISTS \"investigated_at\" TIMESTAMP(3);" \
              "INSERT INTO \"permissions\" (\"id\", \"code\", \"name_en\", \"name_ar\", \"is_active\", \"created_at\", \"updated_at\") VALUES ('perm_complaint_resolve', 'COMPLAINT_RESOLVE', 'Resolve Complaint', 'حل الشكوى', true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (\"code\") DO NOTHING;" \
              "INSERT INTO \"role_permissions\" (\"role_id\", \"permission_id\") SELECT r.\"id\", p.\"id\" FROM \"roles\" r CROSS JOIN \"permissions\" p WHERE p.\"code\" = 'COMPLAINT_RESOLVE' AND r.\"code\" IN ('ADMIN', 'CR_MANAGER', 'BRANCH_MANAGER', 'CR_OFFICER') ON CONFLICT (\"role_id\", \"permission_id\") DO NOTHING;" \
              "INSERT INTO \"board_stages\" (\"id\", \"code\", \"scope\", \"name_en\", \"name_ar\", \"color\", \"position\", \"is_default\", \"mapped_task_status\", \"mapped_complaint_status\", \"updated_at\") VALUES ('board_stage_tickets_completed', 'TICKETS_COMPLETED', 'TICKETS', 'Customer Contacted', 'تم التواصل مع العميل', 'teal', 6, true, NULL, 'COMPLETED', CURRENT_TIMESTAMP) ON CONFLICT (\"code\") DO UPDATE SET \"is_default\" = true, \"name_en\" = EXCLUDED.\"name_en\", \"name_ar\" = EXCLUDED.\"name_ar\", \"color\" = EXCLUDED.\"color\", \"mapped_complaint_status\" = 'COMPLETED', \"updated_at\" = CURRENT_TIMESTAMP;" \
              "UPDATE \"board_stages\" SET \"position\" = 7 WHERE \"code\" = 'TICKETS_CLOSED';" \
              "UPDATE \"board_stages\" SET \"position\" = 8 WHERE \"code\" = 'TICKETS_REOPENED';" \
              "UPDATE \"board_stages\" SET \"position\" = 9 WHERE \"code\" = 'TICKETS_REJECTED';" \
              "UPDATE \"attachments\" SET \"scan_status\" = 'CLEAN' WHERE \"scan_status\" = 'PENDING';" |
              docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
                sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            echo "Complaint root causes and sales advisors verified"

            echo "Verifying default SLA policies..."
            SLA_POLICY_COUNT="$(
              printf '%s\n' \
                "SELECT COUNT(*) FROM sla_policies WHERE is_active = true;" |
                docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
                  sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA' | tr -d '\r'
            )"
            if [ "$SLA_POLICY_COUNT" = "0" ]; then
              echo "No active SLA policies found, installing 24 default SLA policies..."
              printf '%s\n' \
                "INSERT INTO \"sla_policies\" (\"id\", \"severity\", \"stage\", \"duration_minutes\", \"warning_percent\", \"branch_timezone\", \"working_calendar_mode\", \"pause_policy\", \"escalation_level_1\", \"escalation_level_2\", \"escalation_level_3\", \"escalation_level_2_after_breach_minutes\", \"escalation_level_3_after_breach_minutes\", \"is_active\", \"created_at\", \"updated_at\") VALUES ('sla_default_critical_intake', 'CRITICAL', 'INTAKE', 120, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 30, 60, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_critical_manager_review', 'CRITICAL', 'MANAGER_REVIEW', 120, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 30, 60, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_critical_branch_review', 'CRITICAL', 'BRANCH_REVIEW', 120, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 30, 60, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_critical_investigation', 'CRITICAL', 'INVESTIGATION', 120, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 30, 60, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_critical_resolution', 'CRITICAL', 'RESOLUTION', 120, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 30, 60, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_critical_closure', 'CRITICAL', 'CLOSURE', 120, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 30, 60, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_high_intake', 'HIGH', 'INTAKE', 480, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 60, 120, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_high_manager_review', 'HIGH', 'MANAGER_REVIEW', 480, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 60, 120, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_high_branch_review', 'HIGH', 'BRANCH_REVIEW', 480, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 60, 120, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_high_investigation', 'HIGH', 'INVESTIGATION', 480, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 60, 120, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_high_resolution', 'HIGH', 'RESOLUTION', 480, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 60, 120, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_high_closure', 'HIGH', 'CLOSURE', 480, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 60, 120, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_medium_intake', 'MEDIUM', 'INTAKE', 1440, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 120, 240, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_medium_manager_review', 'MEDIUM', 'MANAGER_REVIEW', 1440, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 120, 240, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_medium_branch_review', 'MEDIUM', 'BRANCH_REVIEW', 1440, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 120, 240, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_medium_investigation', 'MEDIUM', 'INVESTIGATION', 1440, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 120, 240, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_medium_resolution', 'MEDIUM', 'RESOLUTION', 1440, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 120, 240, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_medium_closure', 'MEDIUM', 'CLOSURE', 1440, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 120, 240, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_low_intake', 'LOW', 'INTAKE', 4320, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 240, 480, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_low_manager_review', 'LOW', 'MANAGER_REVIEW', 4320, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 240, 480, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_low_branch_review', 'LOW', 'BRANCH_REVIEW', 4320, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 240, 480, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_low_investigation', 'LOW', 'INVESTIGATION', 4320, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 240, 480, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_low_resolution', 'LOW', 'RESOLUTION', 4320, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 240, 480, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP), ('sla_default_low_closure', 'LOW', 'CLOSURE', 4320, 80, 'Asia/Riyadh', 'ALWAYS_ON', 'NONE', 'BRANCH_MANAGER', 'CR_MANAGER', 'ADMIN', 240, 480, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP) ON CONFLICT (\"id\") DO NOTHING;" |
                docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
                  sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            fi
            echo "Default SLA policies verified"


            echo "Verifying deployment revision labels..."
            for SERVICE in api web worker caddy; do
              CONTAINER="cms-auto-prod-$SERVICE-1"
              LABEL_SHA="$(docker inspect --format='{{ index .Config.Labels "com.cms-auto.revision" }}' "$CONTAINER" | tr -d '\r')"
              echo "Service $SERVICE revision: $LABEL_SHA (expected: $DEPLOYMENT_SHA)"
              test "$LABEL_SHA" = "$DEPLOYMENT_SHA"
            done
            echo "Deployment revision labels verified"

            # Fail unless host Nginx serves this exact release publicly.
            echo "Verifying host proxy reachability..."
            curl -fsS -H "Host: $SITE_DOMAIN" http://127.0.0.1:8080/ >/dev/null
            echo "Host proxy reached successfully"

            echo "Verifying public deployment revision..."
            PUBLIC_SHA="$(curl -fsSI "https://$SITE_DOMAIN/" | tr -d '\r' | awk -F': ' 'tolower($1) == "x-cms-deployment" { print $2 }')"
            echo "Public deployment revision: $PUBLIC_SHA (expected: $DEPLOYMENT_SHA)"
            test "$PUBLIC_SHA" = "$DEPLOYMENT_SHA"

            echo "Verifying public health endpoint..."
            curl -fsS "https://$SITE_DOMAIN/api/health" >/dev/null
            echo "Public health API verified"

            echo "Production deployed and verified"
