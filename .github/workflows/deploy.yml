name: Production Deployment

on:
  push:
    branches:
      - production

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @cms-auto/database generate

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Check OpenAPI contract consistency
        run: pnpm openapi:check

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run unit and sanity tests
        run: pnpm test

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            # Navigate to the repository directory
            cd ${{ secrets.DEPLOY_PATH || '~/cms-auto' }}

            # Pull latest changes from production branch
            git fetch origin
            git checkout production
            git pull origin production

            # Set up pnpm and run local validation checks
            corepack enable
            corepack pnpm install --frozen-lockfile
            corepack pnpm prod:config:check -- --env-file .env.production
            docker compose --env-file .env.production -f docker-compose.prod.yml config

            # Build and deploy production containers
            docker compose --env-file .env.production -f docker-compose.prod.yml build
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d

            # Clean up old unused images
            docker image prune -f
