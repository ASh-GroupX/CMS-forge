name: Production Deployment

on:
  push:
    branches:
      - production

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PRODUCTION_SITE_DOMAIN: cms.laith-alobaidi-crm.com

jobs:
  validate:
    name: Validate and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @cms-auto/database generate

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Check OpenAPI contract consistency
        run: pnpm openapi:check

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run unit and sanity tests
        run: pnpm test

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check VPS SSH Reachability
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          timeout 60 bash -c "until nc -zvw5 \"$VPS_HOST\" \"$VPS_PORT\"; do sleep 5; done"

      - name: Create release tarball
        run: |
          tar -czf ../release.tar.gz --exclude=node_modules --exclude=.git --exclude=.github .
          mv ../release.tar.gz .

      - name: Upload release tarball to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: "release.tar.gz"
          target: "/root/cms-auto/"

      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -eu

            # Ensure target directory exists
            mkdir -p /root/cms-auto
            cd /root/cms-auto
            DEPLOYMENT_SHA='${{ github.sha }}'
            export DEPLOYMENT_SHA

            # Extract release package and clean up tarball
            tar -xzf release.tar.gz
            rm -f release.tar.gz

            # Validate production inputs without a runtime package download.
            node tools/prod-config-check.mjs --env-file .env.production
            docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet
            SITE_DOMAIN="$(grep '^SITE_DOMAIN=' .env.production | cut -d= -f2-)"
            test -n "$SITE_DOMAIN"
            test "$SITE_DOMAIN" = '${{ env.PRODUCTION_SITE_DOMAIN }}'

            # Create and verify a pre-migration database backup. Fail closed so
            # the migrate service cannot run unless the current database is safe.
            BACKUP_DIR=/root/cms-auto-backups/postgres
            BACKUP_FILE="$BACKUP_DIR/cms-auto-$(date -u +%Y%m%dT%H%M%SZ).dump"
            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
              sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$BACKUP_FILE"
            test -s "$BACKUP_FILE"
            chmod 600 "$BACKUP_FILE"
            echo "Pre-migration database backup created and verified"

            # Build and deploy production containers
            docker compose --env-file .env.production -f docker-compose.prod.yml build
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d

            # Health Check Verification (checks every long-running CMS service)
            echo "Waiting for services to become healthy..."
            UNHEALTHY="api web worker caddy postgres redis"
            for i in $(seq 1 45); do
              UNHEALTHY=""
              for SERVICE in api web worker caddy postgres redis; do
                CONTAINER="cms-auto-prod-$SERVICE-1"
                STATUS="$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || true)"
                if [ "$STATUS" != "healthy" ]; then
                  UNHEALTHY="$UNHEALTHY $SERVICE"
                fi
              done
              if [ -z "$UNHEALTHY" ]; then
                break
              fi
              sleep 2
            done

            if [ -n "$UNHEALTHY" ]; then
              echo "Deployment failed: unhealthy services:$UNHEALTHY"
              docker compose --env-file .env.production -f docker-compose.prod.yml logs \
                api web worker caddy postgres redis || true
              exit 1
            fi

            # Fail closed unless all production routing defaults are queryable.
            DEFAULT_DEPARTMENT_COUNT="$(
              printf '%s\n' \
                "SELECT COUNT(*) FROM departments WHERE branch_id IS NULL AND is_active = true AND code IN ('SALES','SERVICE','PARTS','BODY_PAINT','FINANCE','CUSTOMER_CARE');" |
                docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
                  sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA'
            )"
            test "$DEFAULT_DEPARTMENT_COUNT" = "6"
            echo "Default departments verified"

            for SERVICE in api web worker caddy; do
              CONTAINER="cms-auto-prod-$SERVICE-1"
              test "$(docker inspect --format='{{ index .Config.Labels "com.cms-auto.revision" }}' "$CONTAINER")" = "$DEPLOYMENT_SHA"
            done

            # Fail unless host Nginx serves this exact release publicly.
            curl -fsS -H "Host: $SITE_DOMAIN" http://127.0.0.1:8080/ >/dev/null
            PUBLIC_SHA="$(curl -fsSI "https://$SITE_DOMAIN/" | tr -d '\r' | awk -F': ' 'tolower($1) == "x-cms-deployment" { print $2 }')"
            test "$PUBLIC_SHA" = "$DEPLOYMENT_SHA"
            curl -fsS "https://$SITE_DOMAIN/api/health" >/dev/null

            echo "Production deployed and verified"
